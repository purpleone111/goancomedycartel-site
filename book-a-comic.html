<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goan Comedy Cartel — Corporate Shows</title>

<style>
:root {
  --black: #050505;
  --pink: #ff2f9f;
  --teal: #00f5d4;
  --yellow: #ffe600;
  --orange: #ff6b1a;
  --violet: #b14aed;
  --lime: #c6ff00;
  --white: #fff;
  --grey: #161616;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial Black, Impact, Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.shape {
  position: fixed;
  z-index: 0;
  pointer-events: none;
}

.square-1 {
  width: 55px;
  height: 55px;
  background: var(--teal);
  top: 8%;
  left: 63%;
  transform: rotate(14deg);
}

.square-2 {
  width: 32px;
  height: 32px;
  background: var(--yellow);
  top: 20%;
  right: 5%;
  transform: rotate(-18deg);
}

.square-3 {
  width: 70px;
  height: 70px;
  background: var(--pink);
  bottom: 10%;
  left: 5%;
  transform: rotate(-12deg);
}

.square-4 {
  width: 25px;
  height: 25px;
  background: var(--teal);
  bottom: 25%;
  right: 3%;
  transform: rotate(25deg);
}

.square-5 {
  width: 42px;
  height: 42px;
  background: var(--yellow);
  top: 48%;
  left: 1%;
  transform: rotate(8deg);
}

.square-6 {
  width: 28px;
  height: 28px;
  background: var(--pink);
  top: 65%;
  right: 6%;
  transform: rotate(-25deg);
}

.contact-wrap {
  position: relative;
  z-index: 2;
  width: min(900px, 92%);
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 0;
}

.kicker {
  color: var(--teal);
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  color: var(--pink);
  font-size: clamp(45px, 9vw, 100px);
  line-height: 0.9;
  letter-spacing: -4px;
  text-transform: uppercase;
  text-shadow: 3px 3px 0 var(--teal);
}

.contact-copy {
  font-family: Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(15px, 2.2vw, 19px);
  line-height: 1.6;
  color: var(--white);
  max-width: 550px;
  margin: 28px 0 40px;
}

.contact-btn {
  display: inline-block;
  background: var(--yellow);
  color: var(--black);
  text-decoration: none;
  padding: 20px 40px;
  border: 5px solid var(--black);
  box-shadow: 9px 9px 0 var(--pink);
  font-size: clamp(16px, 2.5vw, 20px);
  font-weight: 900;
  letter-spacing: 1px;
  transition: 0.15s;
}

.contact-btn:hover {
  transform: translate(4px, 4px);
  box-shadow: 5px 5px 0 var(--pink);
}

.email-fallback {
  margin-top: 22px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: var(--white);
}

.email-fallback span {
  color: var(--teal);
  font-weight: 700;
}

#copyBtn {
  margin-left: 8px;
  background: transparent;
  border: 2px solid var(--teal);
  color: var(--teal);
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  cursor: pointer;
}

#copyBtn:hover {
  background: var(--teal);
  color: var(--black);
}

.back-link {
  margin-top: 45px;
  font-family: Arial, sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--teal);
  text-decoration: none;
  letter-spacing: 1px;
}

.back-link:hover {
  color: var(--white);
}

@media (max-width: 520px) {

  h1 {
    font-size: 52px;
    letter-spacing: -2px;
  }

  .contact-copy {
    font-size: 15px;
  }

  .contact-btn {
    padding: 16px 28px;
    border-width: 4px;
    box-shadow: 6px 6px 0 var(--pink);
  }

  .square-1 {
    width: 30px;
    height: 30px;
  }

  .square-3 {
    width: 40px;
    height: 40px;
  }
}
</style>
</head>

<body>

<div class="shape square-1"></div>
<div class="shape square-2"></div>
<div class="shape square-3"></div>
<div class="shape square-4"></div>
<div class="shape square-5"></div>
<div class="shape square-6"></div>


<main class="contact-wrap">

  <div class="kicker">
    CORPORATE &amp; PRIVATE SHOWS
  </div>

  <h1>
    BOOK US<br>
    FOR YOUR EVENT
  </h1>

  <p class="contact-copy">
    Planning an upcoming office party, reunion, or celebration?
    We've got you covered. Drop us an email, and we promise to
    bring the fun.
  </p>

  <a
    class="contact-btn"
    id="emailBtn"
    href="#"
  >
    GET IN TOUCH →
  </a>

  <p class="email-fallback" id="emailFallback">
    or email us directly at
    <span id="emailText">···</span>
    <button id="copyBtn" type="button">Copy</button>
  </p>

  <a class="back-link" href="https://goancomedycartel.com">
    ← BACK TO HOME
  </a>

</main>


<script>

  var user = "contact";
  var domain = "goancomedycartel.com";
  var fullEmail = user + "@" + domain;

  document.getElementById("emailText").textContent = fullEmail;

  document
    .getElementById("emailBtn")
    .addEventListener("click", function (event) {

      event.preventDefault();

      window.location.href =
        "mailto:" + fullEmail +
        "?subject=Show%20Inquiry";

    });

  document
    .getElementById("copyBtn")
    .addEventListener("click", function () {

      navigator.clipboard.writeText(fullEmail).then(function () {
        var btn = document.getElementById("copyBtn");
        var original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(function () {
          btn.textContent = original;
        }, 1500);
      });

    });

</script>

</body>
</html>
