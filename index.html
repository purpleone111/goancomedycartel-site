<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goan Comedy Cartel</title>

<style>
:root {
  --black: #050505;
  --pink: #ff2f9f;
  --teal: #00f5d4;
  --yellow: #ffe600;
  --orange: #ff6b1a;
  --violet: #b14aed;
  --lime: #c6ff00;
  --white: #fff;
  --grey: #161616;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial Black, Impact, Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

/* =========================
   LOGO GIF
========================= */

.logo-wrap {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
  padding: 25px 5%;
}

.logo-wrap img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* =========================
   FLOATING SQUARES
========================= */

.shape {
  position: fixed;
  z-index: 0;
  pointer-events: none;
}

.square-1 {
  width: 55px;
  height: 55px;
  background: var(--teal);
  top: 8%;
  left: 63%;
  transform: rotate(14deg);
}

.square-2 {
  width: 32px;
  height: 32px;
  background: var(--yellow);
  top: 20%;
  right: 5%;
  transform: rotate(-18deg);
}

.square-3 {
  width: 70px;
  height: 70px;
  background: var(--pink);
  bottom: 10%;
  left: 5%;
  transform: rotate(-12deg);
}

.square-4 {
  width: 25px;
  height: 25px;
  background: var(--teal);
  bottom: 25%;
  right: 3%;
  transform: rotate(25deg);
}

.square-5 {
  width: 42px;
  height: 42px;
  background: var(--yellow);
  top: 48%;
  left: 1%;
  transform: rotate(8deg);
}

.square-6 {
  width: 28px;
  height: 28px;
  background: var(--pink);
  top: 65%;
  right: 6%;
  transform: rotate(-25deg);
}

/* =========================
   MAIN
========================= */

.calendar-wrap {
  position: relative;
  z-index: 2;
  width: min(1150px, 92%);
  margin: 0 auto;
  padding: 60px 0 80px;
}

/* =========================
   HEADER
========================= */

.header {
  position: relative;
  margin-bottom: 45px;
}

.kicker {
  color: var(--teal);
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  color: var(--pink);
  font-size: clamp(55px, 10vw, 125px);
  line-height: 0.82;
  letter-spacing: -6px;
  text-transform: uppercase;
  text-shadow: 3px 3px 0 var(--teal);
}

.header-tag {
  display: inline-block;
  background: var(--yellow);
  color: var(--black);
  padding: 9px 15px;
  margin-top: 25px;
  transform: rotate(-2deg);
  font-size: 13px;
  letter-spacing: 1px;
}

/* =========================
   MONTH CONTROLS
========================= */

.month-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

.month-title {
  color: var(--yellow);
  font-size: clamp(28px, 5vw, 48px);
  text-transform: uppercase;
  line-height: 1;
}

.controls {
  display: flex;
  gap: 8px;
}

.nav {
  width: 48px;
  height: 48px;
  border: 3px solid var(--white);
  background: var(--black);
  color: var(--white);
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.15s;
}

.nav:hover {
  background: var(--pink);
  border-color: var(--pink);
  color: var(--black);
  transform: rotate(-5deg);
}
