<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goan Comedy Cartel</title>

<style>
:root {
  --black: #050505;
  --pink: #ff2f9f;
  --teal: #00f5d4;
  --yellow: #ffe600;
  --white: #fff;
  --grey: #161616;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial Black, Impact, Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

/* =========================
   LOGO GIF
========================= */

.logo-wrap {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
  padding: 25px 5%;
}

.logo-wrap img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* =========================
   FLOATING SQUARES
========================= */

.shape {
  position: fixed;
  z-index: 0;
  pointer-events: none;
}

.square-1 {
  width: 55px;
  height: 55px;
  background: var(--teal);
  top: 8%;
  left: 63%;
  transform: rotate(14deg);
}

.square-2 {
  width: 32px;
  height: 32px;
  background: var(--yellow);
  top: 20%;
  right: 5%;
  transform: rotate(-18deg);
}

.square-3 {
  width: 70px;
  height: 70px;
  background: var(--pink);
  bottom: 10%;
  left: 5%;
  transform: rotate(-12deg);
}

.square-4 {
  width: 25px;
  height: 25px;
  background: var(--teal);
  bottom: 25%;
  right: 3%;
  transform: rotate(25deg);
}

.square-5 {
  width: 42px;
  height: 42px;
  background: var(--yellow);
  top: 48%;
  left: 1%;
  transform: rotate(8deg);
}

.square-6 {
  width: 28px;
  height: 28px;
  background: var(--pink);
  top: 65%;
  right: 6%;
  transform: rotate(-25deg);
}

/* =========================
   MAIN
========================= */

.calendar-wrap {
  position: relative;
  z-index: 2;
  width: min(1150px, 92%);
  margin: 0 auto;
  padding: 60px 0 80px;
}

/* =========================
   HEADER
========================= */

.header {
  position: relative;
  margin-bottom: 45px;
}

.kicker {
  color: var(--teal);
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  color: var(--pink);
  font-size: clamp(55px, 10vw, 125px);
  line-height: 0.82;
  letter-spacing: -6px;
  text-transform: uppercase;
  text-shadow: 3px 3px 0 var(--teal);
}

.header-tag {
  display: inline-block;
  background: var(--yellow);
  color: var(--black);
  padding: 9px 15px;
  margin-top: 25px;
  transform: rotate(-2deg);
  font-size: 13px;
  letter-spacing: 1px;
}

/* =========================
   MONTH CONTROLS
========================= */

.month-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

.month-title {
  color: var(--yellow);
  font-size: clamp(28px, 5vw, 48px);
  text-transform: uppercase;
  line-height: 1;
}

.controls {
  display: flex;
  gap: 8px;
}

.nav {
  width: 48px;
  height: 48px;
  border: 3px solid var(--white);
  background: var(--black);
  color: var(--white);
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.15s;
}

.nav:hover {
  background: var(--pink);
  border-color: var(--pink);
  color: var(--black);
  transform: rotate(-5deg);
}

/* =========================
   CALENDAR
========================= */

.calendar {
  border: 3px solid var(--white);
  background: var(--black);
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekday {
  background: var(--pink);
  color: var(--black);
  padding: 13px 8px;
  border-right: 2px solid var(--black);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.weekday:last-child {
  border-right: 0;
}

.day {
  min-height: 135px;
  padding: 10px;
  border-right: 1px solid #333;
  border-bottom: 1px solid #333;
  position: relative;
}

.day:nth-child(7n) {
  border-right: 0;
}

.day.empty {
  background: #0d0d0d;
}

.day-number {
  display: inline-flex;
  width: 31px;
  height: 31px;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.today .day-number {
  background: var(--teal);
  color: var(--black);
  transform: rotate(-5deg);
}

/* =========================
   EVENTS
========================= */

.event {
  position: relative;
  margin-top: 9px;
  padding: 10px;
  cursor: pointer;
  color: var(--black);
  border: 3px solid var(--black);
  transition: 0.15s ease;
}

.event:hover {
  transform: translate(-3px, -3px) rotate(-1deg);
}

.event:nth-child(2n) {
  background: var(--pink);
  box-shadow: 5px 5px 0 var(--teal);
}

.event:nth-child(2n + 1) {
  background: var(--yellow);
  box-shadow: 5px 5px 0 var(--pink);
}

.event-title {
  font-size: 11px;
  line-height: 1.05;
  text-transform: uppercase;
}

.event-time {
  margin-top: 6px;
  font-family: Arial, sans-serif;
  font-weight: 900;
  font-size: 10px;
}

/* =========================
   SHOWS
========================= */

.section-heading {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 55px 0 20px;
}

.section-heading h2 {
  margin: 0;
  color: var(--pink);
  font-size: clamp(28px, 5vw, 45px);
  text-transform: uppercase;
  line-height: 1;
}

.section-heading span {
  flex: 1;
  height: 5px;
  background: var(--teal);
}

.event-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.event-card {
  position: relative;
  padding: 25px;
  min-height: 245px;
  color: var(--black);
  border: 4px solid var(--black);
  transition: 0.15s ease;
}

.event-card:hover {
  transform: translateY(-5px) rotate(-1deg);
}

.event-card:nth-child(1) {
  background: var(--yellow);
  box-shadow: 9px 9px 0 var(--pink);
}

.event-card:nth-child(2) {
  background: var(--pink);
  box-shadow: 9px 9px 0 var(--teal);
}

.event-card:nth-child(3) {
  background: var(--teal);
  box-shadow: 9px 9px 0 var(--yellow);
}

.event-date {
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.event-card h3 {
  font-size: clamp(22px, 3vw, 32px);
  line-height: 0.95;
  margin: 0 0 18px;
  text-transform: uppercase;
}

.event-meta {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: 900;
  line-height: 1.4;
  margin-bottom: 20px;
}

.ticket-btn {
  display: inline-block;
  background: var(--black);
  color: var(--white);
  text-decoration: none;
  padding: 12px 16px;
  border: 3px solid var(--black);
  font-size: 11px;
  letter-spacing: 1px;
  transition: 0.15s;
}

.ticket-btn:hover {
  background: var(--white);
  color: var(--black);
}

/* =========================
   MODAL
========================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  position: relative;
  width: min(550px, 100%);
  background: var(--yellow);
  color: var(--black);
  border: 5px solid var(--black);
  padding: 35px;
  box-shadow: 12px 12px 0 var(--pink);
  transform: rotate(-1deg);
}

.close {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 40px;
  height: 40px;
  background: var(--teal);
  color: var(--black);
  border: 3px solid var(--black);
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
}

.modal-date {
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.modal h2 {
  margin: 0 40px 25px 0;
  font-size: clamp(35px, 7vw, 60px);
  line-height: 0.88;
  text-transform: uppercase;
}

.modal-details {
  border-top: 4px solid var(--black);
  border-bottom: 4px solid var(--black);
  padding: 15px 0;
  margin-bottom: 25px;
}

.detail {
  display: flex;
  gap: 15px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: 900;
  margin: 9px 0;
}

.detail strong {
  width: 60px;
}

.modal .ticket-btn {
  background: var(--pink);
  color: var(--black);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

  .calendar-wrap {
    width: 94%;
    padding-top: 40px;
  }

  h1 {
    letter-spacing: -3px;
  }

  .day {
    min-height: 105px;
    padding: 6px;
  }

  .event {
    padding: 7px;
  }

  .event-title {
    font-size: 8px;
  }

  .event-time {
    font-size: 8px;
  }

  .event-list {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 520px) {

  .calendar-wrap {
    padding-top: 30px;
  }

  .kicker {
    font-size: 10px;
  }

  h1 {
    font-size: 58px;
  }

  .header-tag {
    font-size: 10px;
  }

  .weekday {
    font-size: 8px;
    text-align: center;
    padding: 10px 2px;
  }

  .day {
    min-height: 75px;
    padding: 4px;
  }

  .day-number {
    width: 25px;
    height: 25px;
    font-size: 11px;
  }

  .event {
    margin-top: 4px;
    padding: 4px;
    border-width: 2px;
    box-shadow: 2px 2px 0 var(--pink) !important;
  }

  .event-title {
    font-size: 6px;
  }

  .event-time {
    display: none;
  }

  .month-title {
    font-size: 28px;
  }

  .nav {
    width: 40px;
    height: 40px;
  }

  .modal {
    padding: 25px;
  }

  .square-1 {
    width: 30px;
    height: 30px;
  }

  .square-3 {
    width: 40px;
    height: 40px;
  }
}

/* =========================
   INSTAGRAM SECTION
========================= */

.gcc-instagram-wrapper {
  width: 100%;
  background: var(--black);
}

.instagram-cta {
  position: relative;

  width: 100%;
  min-height: 380px;

  margin: 0;
  padding: 55px 5%;

  background: var(--black);

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.instagram-content {
  width: 100%;
  max-width: 1100px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 70px;

  position: relative;
  z-index: 3;
}

.instagram-icon {
  width: 150px;
  height: 150px;

  flex: 0 0 150px;

  background: var(--pink);

  border: 7px solid #000;

  box-shadow: 12px 12px 0 var(--teal);

  transform: rotate(-5deg);

  display: flex;
  align-items: center;
  justify-content: center;
}

.instagram-camera {
  width: 92px;
  height: 92px;

  border: 7px solid #000;
  border-radius: 25px;

  position: relative;
}

.instagram-lens {
  width: 40px;
  height: 40px;

  border: 7px solid #000;
  border-radius: 50%;

  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);
}

.instagram-dot {
  width: 11px;
  height: 11px;

  background: #000;
  border-radius: 50%;

  position: absolute;

  top: 13px;
  right: 13px;
}

.instagram-copy {
  text-align: left;
}

.instagram-kicker {
  font-family: Arial, sans-serif;

  font-weight: 900;
  font-size: 17px;

  letter-spacing: 3px;

  color: var(--teal);

  margin-bottom: 12px;
}

.instagram-copy h2 {
  margin: 0;

  font-family: Arial Black, Arial, sans-serif;

  font-weight: 900;

  font-size: clamp(48px, 7vw, 90px);

  line-height: 0.88;

  letter-spacing: -4px;

  color: var(--pink);

  text-shadow: 3px 3px 0 var(--teal);
}

.instagram-handle {
  margin-top: 22px;

  font-family: Arial, sans-serif;

  font-weight: 800;

  font-size: 22px;

  color: var(--white);
}

.instagram-button {
  display: inline-block;

  margin-top: 25px;

  padding: 14px 25px;

  background: var(--yellow);

  color: #000;

  border: 5px solid #000;

  font-family: Arial Black, Arial, sans-serif;

  font-size: 17px;

  font-weight: 900;

  text-decoration: none;

  box-shadow: 8px 8px 0 var(--pink);
}

.instagram-button:hover {
  transform: translate(3px, 3px);

  box-shadow: 5px 5px 0 var(--pink);
}

.ig-shape {
  position: absolute;

  width: 35px;
  height: 35px;

  border: 5px solid #000;

  z-index: 1;
}

.ig-pink {
  background: var(--pink);

  right: 9%;
  top: 15%;

  transform: rotate(17deg);
}

.ig-yellow {
  background: var(--yellow);

  right: 17%;
  bottom: 13%;

  transform: rotate(-12deg);
}

.ig-teal {
  background: var(--teal);

  left: 8%;
  bottom: 18%;

  transform: rotate(20deg);
}

/* PHONE */

@media (max-width: 700px) {

  .instagram-cta {
    min-height: 560px;

    padding: 50px 7%;

    align-items: center;
  }

  .instagram-content {
    flex-direction: column;

    gap: 35px;

    text-align: center;
  }

  .instagram-icon {
    width: 125px;
    height: 125px;

    flex: 0 0 125px;

    border-width: 6px;

    box-shadow: 10px 10px 0 var(--teal);
  }

  .instagram-camera {
    width: 76px;
    height: 76px;

    border-width: 6px;
  }

  .instagram-lens {
    width: 34px;
    height: 34px;

    border-width: 6px;
  }

  .instagram-dot {
    width: 9px;
    height: 9px;

    top: 11px;
    right: 11px;
  }

  .instagram-copy {
    text-align: center;
  }

  .instagram-kicker {
    font-size: 12px;

    letter-spacing: 2px;
  }

  .instagram-copy h2 {
    font-size: 48px;

    letter-spacing: -3px;

    text-shadow: 5px 5px 0 var(--teal);
  }

  .instagram-handle {
    font-size: 17px;
  }

  .instagram-button {
    font-size: 15px;

    padding: 12px 20px;
  }

  .ig-pink {
    right: 8%;
    top: 8%;
  }

  .ig-yellow {
    right: 10%;
    bottom: 8%;
  }

  .ig-teal {
    left: 8%;
    bottom: 15%;
  }
}
</style>
</head>

<body>

<!-- FLOATING DESIGN ELEMENTS -->

<div class="shape square-1"></div>
<div class="shape square-2"></div>
<div class="shape square-3"></div>
<div class="shape square-4"></div>
<div class="shape square-5"></div>
<div class="shape square-6"></div>


<!-- LOGO -->

<div class="logo-wrap">
  <img src="logo.gif" alt="Goan Comedy Cartel">
</div>


<main class="calendar-wrap">

  <header class="header">

    <div class="kicker">
      GOAN COMEDY CARTEL
    </div>

    <h1>
      WHAT'S FUNNY,<br>
      MA RE?
    </h1>

    <div class="header-tag">
      COMEDY HAPPENING IN GOA ↓
    </div>

  </header>


  <div class="month-bar">

    <div class="month-title" id="monthTitle">
      September 2026
    </div>

    <div class="controls">

      <button class="nav" id="prevMonth">
        ←
      </button>

      <button class="nav" id="nextMonth">
        →
      </button>

    </div>

  </div>


  <section class="calendar">

    <div class="weekdays">
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
      <div class="weekday">Sun</div>
    </div>

    <div class="days" id="calendarDays"></div>

  </section>


  <div class="section-heading">

    <h2>
      This Month
    </h2>

    <span></span>

  </div>


  <section class="event-list" id="eventList"></section>

</main>


<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">

  <div class="modal">

    <button class="close" id="modalClose">
      ×
    </button>

    <div class="modal-date" id="modalDate"></div>

    <h2 id="modalTitle"></h2>

    <div class="modal-details">

      <div class="detail">
        <strong>TIME</strong>
        <span id="modalTime"></span>
      </div>

      <div class="detail">
        <strong>WHERE</strong>
        <span id="modalVenue"></span>
      </div>

    </div>

    <a
      id="modalTickets"
      class="ticket-btn"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      GET TICKETS →
    </a>

  </div>

</div>


<!-- INSTAGRAM -->

<div class="gcc-instagram-wrapper">
  <section class="instagram-cta">

    <div class="instagram-content">

      <div class="instagram-icon">
        <div class="instagram-camera">
          <div class="instagram-lens"></div>
          <div class="instagram-dot"></div>
        </div>
      </div>

      <div class="instagram-copy">
        <div class="instagram-kicker">MORE CHAOS ONLINE</div>

        <h2>FOLLOW US<br>ON INSTAGRAM</h2>

        <div class="instagram-handle">@goancomedycartel</div>

        <a
          class="instagram-button"
          href="https://www.instagram.com/goancomedycartel/"
          target="_blank"
        >
          FOLLOW US →
        </a>
      </div>

    </div>

    <div class="ig-shape ig-pink"></div>
    <div class="ig-shape ig-yellow"></div>
    <div class="ig-shape ig-teal"></div>

  </section>
</div>


<script>

/* ==========================================
   EVENTS
========================================== */

const events = {

  "2026-09-11": {
    title: "GOA'S FINEST @ BAREFOOT",
    time: "7:30 PM",
    venue: "Barefoot, Parra",
    url: "https://in.bookmyshow.com/events/goa-s-finest-barefoot/ET00507157"
  },

  "2026-09-16": {
    title: "COMEDY SLAM HOSTED BY NAVIN NORONHA",
    time: "8:30 PM",
    venue: "Nook, Guirim",
    url: "https://in.bookmyshow.com/events/the-goated-mic/ET00479624"
  },

  "2026-09-19": {
    title: "OVERSMARTGIRI BY ADITYA GUNDETI",
    time: "7:00 PM",
    venue: "Niche Bistro, Calangute",
    url: "https://in.bookmyshow.com/events/oversmartgiri-by-aditya-gundeti/ET00473415"
  }

};


/* ==========================================
   CALENDAR STATE
========================================== */

let currentDate = new Date();
currentDate.setDate(1);


/* ==========================================
   ELEMENTS
========================================== */

const monthTitle =
  document.getElementById("monthTitle");

const calendarDays =
  document.getElementById("calendarDays");

const eventList =
  document.getElementById("eventList");

const modalOverlay =
  document.getElementById("modalOverlay");

const modalClose =
  document.getElementById("modalClose");

const modalDate =
  document.getElementById("modalDate");

const modalTitle =
  document.getElementById("modalTitle");

const modalTime =
  document.getElementById("modalTime");

const modalVenue =
  document.getElementById("modalVenue");

const modalTickets =
  document.getElementById("modalTickets");


/* ==========================================
   HELPERS
========================================== */

function pad(number) {

  return String(number).padStart(2, "0");

}


function dateKey(year, month, day) {

  return (
    year +
    "-" +
    pad(month + 1) +
    "-" +
    pad(day)
  );

}


function formatDate(dateString) {

  const date =
    new Date(dateString + "T12:00:00");

  return date.toLocaleDateString("en-IN", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

}


/* ==========================================
   OPEN EVENT
========================================== */

function openEvent(key) {

  const event = events[key];

  if (!event) return;

  modalDate.textContent =
    formatDate(key);

  modalTitle.textContent =
    event.title;

  modalTime.textContent =
    event.time;

  modalVenue.textContent =
    event.venue;

  modalTickets.href =
    event.url;

  modalOverlay.classList.add("active");

}


/* ==========================================
   CLOSE EVENT
========================================== */

function closeModal() {

  modalOverlay.classList.remove("active");

}


modalClose.addEventListener(
  "click",
  closeModal
);


modalOverlay.addEventListener(
  "click",
  function(event) {

    if (
      event.target === modalOverlay
    ) {
      closeModal();
    }

  }
);


document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      closeModal();
    }

  }
);


/* ==========================================
   RENDER CALENDAR
========================================== */

function renderCalendar() {

  calendarDays.innerHTML = "";
  eventList.innerHTML = "";

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  monthTitle.textContent =
    currentDate.toLocaleDateString(
      "en-IN",
      {
        month: "long",
        year: "numeric"
      }
    );


  /*
    Convert Sunday-first JavaScript
    calendar into Monday-first.
  */

  let firstDay =
    new Date(year, month, 1).getDay();

  firstDay =
    firstDay === 0
      ? 6
      : firstDay - 1;


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const previousMonthDays =
    new Date(
      year,
      month,
      0
    ).getDate();


  /* Previous month */

  for (
    let i = firstDay - 1;
    i >= 0;
    i--
  ) {

    const cell =
      document.createElement("div");

    cell.className =
      "day empty";

    const number =
      document.createElement("span");

    number.className =
      "day-number";

    number.textContent =
      previousMonthDays - i;

    number.style.opacity =
      "0.25";

    cell.appendChild(number);

    calendarDays.appendChild(cell);

  }


  /* Current month */

  const now = new Date();
  const isCurrentMonth =
    now.getFullYear() === year &&
    now.getMonth() === month;

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const cell =
      document.createElement("div");

    cell.className =
      "day";

    if (isCurrentMonth && day === now.getDate()) {
      cell.classList.add("today");
    }


    const number =
      document.createElement("span");

    number.className =
      "day-number";

    number.textContent =
      day;

    cell.appendChild(number);


    const key =
      dateKey(
        year,
        month,
        day
      );


    /* Event */

    if (events[key]) {

      const event =
        events[key];

      const eventElement =
        document.createElement("div");

      eventElement.className =
        "event";

      eventElement.innerHTML = `
        <div class="event-title">
          ${event.title}
        </div>

        <div class="event-time">
          ${event.time}
        </div>
      `;


      eventElement.addEventListener(
        "click",
        function() {
          openEvent(key);
        }
      );


      cell.appendChild(
        eventElement
      );

      cell.style.cursor =
        "pointer";

    }


    calendarDays.appendChild(cell);

  }


  /* Fill last row */

  const totalCells =
    firstDay + daysInMonth;

  const remaining =
    (7 - (totalCells % 7)) % 7;


  for (
    let i = 1;
    i <= remaining;
    i++
  ) {

    const cell =
      document.createElement("div");

    cell.className =
      "day empty";


    const number =
      document.createElement("span");

    number.className =
      "day-number";

    number.textContent =
      i;

    number.style.opacity =
      "0.25";


    cell.appendChild(number);

    calendarDays.appendChild(cell);

  }


  renderEventList(
    year,
    month
  );

}


/* ==========================================
   EVENT CARDS
========================================== */

function renderEventList(year, month) {

  const monthEvents =
    Object.entries(events)
      .filter(function([key]) {

        const date =
          new Date(
            key + "T12:00:00"
          );

        return (
          date.getFullYear() === year &&
          date.getMonth() === month
        );

      })
      .sort(function(a, b) {

        return a[0].localeCompare(
          b[0]
        );

      });


  if (
    monthEvents.length === 0
  ) {

    eventList.innerHTML = `
      <article class="event-card">

        <h3>
          NOTHING YET.
        </h3>

        <div class="event-meta">
          Which is suspicious.
          Check back soon.
        </div>

      </article>
    `;

    return;

  }


  monthEvents.forEach(
    function([key, event]) {

      const card =
        document.createElement("article");

      card.className =
        "event-card";


      card.innerHTML = `

        <div class="event-date">
          ${formatDate(key)}
        </div>

        <h3>
          ${event.title}
        </h3>

        <div class="event-meta">
          ${event.time}<br>
          ${event.venue}
        </div>

        <a
          class="ticket-btn"
          href="${event.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          GET TICKETS →
        </a>

      `;


      eventList.appendChild(card);

    }
  );

}


/* ==========================================
   MONTH NAVIGATION
========================================== */

document
  .getElementById("prevMonth")
  .addEventListener(
    "click",
    function() {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();

    }
  );


document
  .getElementById("nextMonth")
  .addEventListener(
    "click",
    function() {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();

    }
  );


/* ==========================================
   START
========================================== */

renderCalendar();

</script>
